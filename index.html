<!doctype html>
<html lang="es-MX" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Vainilla Crêpe | Menú de crepas en Mexicali</title>
    <meta name="description" content="Menú de Vainilla Crêpe: Signature Crêpes con sus ingredientes y precios, y arma tu propia crepa. Mexicali, Baja California.">
    <meta name="theme-color" content="#30120E">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_MX">
    <meta property="og:title" content="Vainilla Crêpe">
    <meta property="og:description" content="Una experiencia inolvidable para ese momento. Conoce nuestras Signature Crêpes o arma la tuya.">
    <meta property="og:image" content="%OG_IMAGE%">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!--CANONICAL-->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preload" as="image" href="img/logo.webp" type="image/webp">

    <!-- Bienvenida: estilos y lógica en línea para que aparezca en el primer pintado.
         Se oculta sola por CSS en < 1 s aunque falle el JS. -->
    <style>
      html { background: #F6E8D7; }
      #bienvenida {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #30120E;
        pointer-events: none;
        animation: vc-salida 0.4s ease-in-out 0.4s forwards;
      }
      #bienvenida img { width: min(56.5vw, 31.8svh, 353px); height: auto; }
      /* Orillas difuminadas para fundir el recorte con el café liso */
      .logo-fundido {
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent), linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent), linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent);
        mask-composite: intersect;
      }
      @keyframes vc-salida { to { opacity: 0; visibility: hidden; } }
      .vc-visto #bienvenida { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #bienvenida { animation-duration: 0.15s; animation-delay: 0.35s; }
      }
    </style>
    <script>
      document.documentElement.classList.replace('no-js', 'js');
      try {
        if (sessionStorage.getItem('vc-bienvenida')) document.documentElement.classList.add('vc-visto');
        else sessionStorage.setItem('vc-bienvenida', '1');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="bienvenida" aria-hidden="true">
      <img class="logo-fundido" src="img/logo.webp" width="532" height="352" alt="">
    </div>

    <a class="saltar" href="#menu">Ir al menú</a>

    <header class="cabecera">
      <h1 class="cabecera__logo">
        <img class="logo-fundido" src="img/logo.webp" width="532" height="352" alt="Vainilla Crêpe">
      </h1>
      <p class="cabecera__lema">Una experiencia inolvidable para ese momento</p>
    </header>

    <main id="menu">
      <div class="pestanas" role="tablist" aria-label="Menú">
        <button type="button" role="tab" id="tab-signature" aria-controls="panel-signature" aria-selected="true">Signature Crêpes</button>
        <button type="button" role="tab" id="tab-arma" aria-controls="panel-arma" aria-selected="false" tabindex="-1">Arma tu Crêpe</button>
      </div>

      <section class="panel" role="tabpanel" id="panel-signature" aria-labelledby="tab-signature" tabindex="0">
        <!--CATALOGO-->
      </section>

      <section class="panel" role="tabpanel" id="panel-arma" aria-labelledby="tab-arma" tabindex="0" hidden>
        <!--ARMA-->
      </section>

      <!--VISITANOS-->

      <!-- Reservado para v2 (no mostrar contenido ficticio):
           eventos y paquetes, promociones, reseñas auténticas de Google. -->
    </main>

    <footer class="pie">
      <img class="pie__estrella" src="favicon.png" width="48" height="48" alt="">
      <p>Vainilla Crêpe <span class="pie__lugar">Mexicali, Baja California</span></p>
      <p class="pie__anio">© %ANIO%</p>
    </footer>

    <!-- Barra inferior: precio estimado (en Arma tu Crêpe) + contacto. Un solo elemento,
         así el precio y los botones de contacto nunca se enciman. -->
    <div class="dock" id="dock" data-contacto="" hidden>
      <div class="dock__precio" id="dock-precio" hidden>
        <p class="dock__total"><span class="dock__etiqueta">Total estimado</span> <strong id="total">$130</strong></p>
        <p class="dock__detalle" id="dock-detalle"></p>
      </div>
      <div class="dock__contacto"><!--CONTACTO--></div>
    </div>
    <p class="sr-only" id="anuncio" aria-live="polite" aria-atomic="true"></p>

    <dialog class="detalle" id="detalle" aria-labelledby="detalle-titulo">
      <div class="detalle__marco">
        <button type="button" class="detalle__cerrar" id="detalle-cerrar" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="detalle__foto foto-arco" id="detalle-foto"></div>
        <div class="detalle__texto">
          <h2 id="detalle-titulo"></h2>
          <p class="detalle__precio" id="detalle-precio"></p>
          <p class="detalle__ingredientes" id="detalle-ingredientes"></p>
        </div>
      </div>
    </dialog>
  </body>
</html>
